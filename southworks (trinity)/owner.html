<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Owner Panel · Southworks (Trinity)</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <h1>Owner Panel</h1>
        <span class="chip" id="who"></span>
      </header>
      <div class="stats" id="stats"></div>
      <section class="card">
        <h3>Quotations</h3>
        <div id="qs"></div>
      </section>
      <div class="split">
        <section class="card">
          <h3>Material prices &amp; labor</h3>
          <div id="rates"></div>
        </section>
        <section class="card">
          <h3>User accounts</h3>
          <div id="users"></div>
        </section>
      </div>
      <p class="muted mt">
        <button class="btn ghost sm" id="reset">Reset demo data</button>
      </p>
    </main>
    <script src="js/app.js"></script>
    <script>
      (function () {
        const u = SW.need("owner"),
          $ = SW.$;
        const R = [
          ["aluminum", "Aluminum / m"],
          ["glass.clear", "Glass clear / m²"],
          ["glass.tinted", "Glass tinted / m²"],
          ["glass.frosted", "Glass frosted / m²"],
          ["accessories.window", "Accessories · window"],
          ["accessories.door", "Accessories · door"],
          ["accessories.fixed", "Accessories · fixed"],
          ["labor.window", "Labor · window"],
          ["labor.door", "Labor · door"],
          ["labor.fixed", "Labor · fixed"],
        ];
        const get = (o, k) => k.split(".").reduce((a, c) => a[c], o);
        function render() {
          const db = SW.db(),
            open = db.quotations.filter((q) => q.status !== "Approved").length,
            ong = db.projects.filter((p) => p.status === "Ongoing").length,
            done = db.projects.filter((p) => p.status === "Completed").length,
            sched = db.quotations.filter(
              (q) => q.status === "Approved" && !q.projectId,
            ).length;
          $("stats").innerHTML = [
            ["Open quotations", open],
            ["To schedule", sched],
            ["Ongoing projects", ong],
            ["Completed", done],
          ]
            .map(
              ([l, n]) =>
                `<div class="card"><small>${l}</small><b>${n}</b></div>`,
            )
            .join("");
          $("qs").innerHTML =
            `<div class="tw"><table><thead><tr><th>ID</th><th>Customer</th><th>Design</th><th class="r">Total</th><th>Status</th><th>Action</th></tr></thead><tbody>
      ${db.quotations
        .slice()
        .reverse()
        .map((q) => {
          let a = "—";
          if (["Awaiting approval", "Reduction requested"].includes(q.status))
            a = `<div class="inline"><input class="d" type="number" min="0" placeholder="Reduction ₱" value="${q.discount || ""}" style="max-width:120px"><button class="btn sm" data-a="adj">Adjust price</button></div>`;
          else if (q.status === "Approved" && !q.projectId)
            a = `<div class="inline"><input class="dl" type="date" min="${SW.today()}"><button class="btn sm" data-a="proj">Set deadline</button></div>`;
          else if (q.projectId)
            a = `<small class="muted">Project ${q.projectId}</small>`;
          else a = '<small class="muted">Awaiting measurement</small>';
          return `<tr data-id="${q.id}"><td>${q.id}</td><td>${SW.esc(SW.userName(q.userId))}</td><td>${SW.esc(SW.PRODUCTS[q.spec.product].name)} · ${q.spec.width}×${q.spec.height}</td><td class="r">${SW.peso(q.total)}</td><td>${SW.chip(q.status)}</td><td>${a}</td></tr>`;
        })
        .join("")}</tbody></table></div>`;
          $("rates").innerHTML =
            `<div class="row" style="flex-wrap:wrap">${R.map(([k, l]) => `<label style="flex:1 1 140px">${l}<input data-k="${k}" type="number" min="0" value="${get(db.rates, k)}"></label>`).join("")}</div><button class="btn" id="sr">Save rates</button>`;
          $("users").innerHTML = `<div class="tw"><table><tbody>${db.users
            .map(
              (x) =>
                `<tr><td>${SW.esc(x.name)}<br><small class="muted">${SW.esc(x.email)}</small></td><td><select data-u="${x.id}" ${x.id === u.id ? "disabled" : ""} style="margin:0">${Object.entries(
                  SW.ROLES,
                )
                  .map(
                    ([k, v]) =>
                      `<option value="${k}"${k === x.role ? " selected" : ""}>${v}</option>`,
                  )
                  .join("")}</select></td></tr>`,
            )
            .join("")}</tbody></table></div>`;
        }
        document.addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          try {
            if (b.id === "sr") {
              const db = SW.db(),
                r = JSON.parse(JSON.stringify(db.rates));
              document.querySelectorAll("[data-k]").forEach((i) => {
                const v = +i.value;
                if (!(v >= 0)) throw new Error("Rates must be zero or more.");
                const p = i.dataset.k.split(".");
                let o = r;
                while (p.length > 1) o = o[p.shift()];
                o[p[0]] = v;
              });
              SW.setRates(r);
              SW.toast("Rates saved. New quotations use these prices.");
              render();
              return;
            }
            if (b.id === "reset") {
              if (confirm("Reset all demo data?")) {
                SW.reset();
                SW.toast("Demo data reset.");
                render();
              }
              return;
            }
            const tr = b.closest("tr");
            if (!tr) return;
            const id = tr.dataset.id;
            if (b.dataset.a === "adj") {
              SW.adjust(id, +tr.querySelector(".d").value || 0, u.name);
              SW.toast("Price adjusted.");
            }
            if (b.dataset.a === "proj") {
              SW.createProject(id, tr.querySelector(".dl").value, u.name);
              SW.toast("Project record created.");
            }
            render();
          } catch (x) {
            SW.toast(x.message, true);
          }
        });
        document.addEventListener("change", (e) => {
          const s = e.target.closest("[data-u]");
          if (s) {
            SW.setRole(s.dataset.u, s.value);
            SW.toast("Role updated.");
          }
        });
        render();
      })();
    </script>
  </body>
</html>
