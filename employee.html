<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Employee Panel · Southworks (Trinity)</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <h1>Employee Panel</h1>
        <span class="chip" id="who"></span>
      </header>
      <section class="card">
        <h3>Measurements to verify</h3>
        <p class="muted">
          Enter the verified on-site measurements. The system then computes the
          quotation.
        </p>
        <div id="meas"></div>
      </section>
      <section class="card">
        <h3>Projects</h3>
        <div id="proj"></div>
      </section>
    </main>
    <script src="js/app.js"></script>
    <script>
      (function () {
        const u = SW.need("employee", "owner"),
          $ = SW.$;
        function render() {
          const db = SW.db(),
            qs = db.quotations.filter(
              (q) => q.status === "Pending measurement",
            );
          $("meas").innerHTML = qs.length
            ? `<div class="tw"><table><thead><tr><th>ID</th><th>Customer</th><th>Design</th><th>Width</th><th>Height</th><th>Notes</th><th></th></tr></thead><tbody>
      ${qs
        .map(
          (
            q,
          ) => `<tr data-id="${q.id}"><td>${q.id}</td><td>${SW.esc(SW.userName(q.userId))}</td><td>${SW.esc(SW.PRODUCTS[q.spec.product].name)}</td>
      <td><input class="w" type="number" value="${q.spec.width}" style="width:84px"></td><td><input class="h" type="number" value="${q.spec.height}" style="width:84px"></td>
      <td><input class="n" placeholder="Optional"></td><td><button class="btn sm" data-a="v">Save specification</button></td></tr>`,
        )
        .join("")}</tbody></table></div>`
            : '<p class="muted">Nothing waiting for measurement.</p>';
          const ps = db.projects.slice().reverse();
          $("proj").innerHTML = ps.length
            ? `<div class="tw"><table><thead><tr><th>ID</th><th>Customer</th><th>Product</th><th>Deadline</th><th>Stage</th><th>Progress</th><th>Remarks</th><th></th></tr></thead><tbody>
      ${ps
        .map((p) => {
          const q = db.quotations.find((x) => x.id === p.quotationId),
            done = p.status === "Completed";
          return `<tr data-id="${p.id}"><td>${p.id}</td><td>${SW.esc(SW.userName(p.userId))}</td><td>${SW.esc(SW.PRODUCTS[q.spec.product].name)}</td><td>${SW.fdate(p.deadline)}</td>
      <td>${done ? '<span class="chip ok">Completed</span>' : `<select class="s">${SW.STAGES.map((s) => `<option${s[0] === p.stage ? " selected" : ""}>${s[0]}</option>`).join("")}</select>`}</td>
      <td>${done ? "100%" : `<input class="p" type="range" min="0" max="99" value="${p.progress}" style="width:110px"> <small class="pv">${p.progress}%</small>`}</td>
      <td>${done ? "" : '<input class="m" placeholder="What was done?">'}</td><td>${done ? "" : '<button class="btn sm" data-a="u">Update</button>'}</td></tr>`;
        })
        .join("")}</tbody></table></div>`
            : '<p class="muted">No projects yet.</p>';
        }
        document.addEventListener("input", (e) => {
          if (e.target.classList.contains("p"))
            e.target.parentNode.querySelector(".pv").textContent =
              e.target.value + "%";
        });
        document.addEventListener("click", (e) => {
          const b = e.target.closest("button[data-a]");
          if (!b) return;
          const tr = b.closest("tr"),
            id = tr.dataset.id,
            q = (s) => tr.querySelector(s);
          try {
            if (b.dataset.a === "v") {
              SW.verify(
                id,
                +q(".w").value,
                +q(".h").value,
                q(".n").value,
                u.name,
              );
              SW.toast("Specification saved. Quotation generated.");
            } else {
              SW.updateProject(
                id,
                q(".s").value,
                +q(".p").value,
                q(".m").value,
                u.name,
              );
              SW.toast("Project updated.");
            }
            render();
          } catch (x) {
            SW.toast(x.message, true);
          }
        });
        render();
      })();
    </script>
  </body>
</html>
