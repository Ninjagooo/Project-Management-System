<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Product Customizer · Southworks (Trinity)</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <h1 id="ttl">3D Product Customizer</h1>
        <span class="chip" id="who"></span>
      </header>

      <div class="split">
        <section class="card stage">
          <div id="viewport" aria-label="3D preview of your design"></div>
          <small class="muted">Drag to rotate · scroll / pinch to zoom</small>
        </section>
        <section class="card">
          <h3>Customize your design</h3>
          <p class="muted" id="editnote" hidden></p>
          <label>Product<select id="product"></select></label>
          <div class="row">
            <label
              >Width (cm)<input
                id="w"
                type="number"
                inputmode="numeric"
                step="1" /><span class="hint" id="wh"></span
            ></label>
            <label
              >Height (cm)<input
                id="h"
                type="number"
                inputmode="numeric"
                step="1" /><span class="hint" id="hh"></span
            ></label>
          </div>
          <label
            >Frame finish
            <div class="swatches" id="finish"></div
          ></label>
          <div class="row">
            <label>Glass type<select id="glass"></select></label>
            <label>Panels<select id="panels"></select></label>
          </div>
          <p class="err" id="err" role="alert"></p>
          <div class="est" aria-live="polite">
            <b>Estimated price</b>
            <ul id="estl"></ul>
            <div class="tot"><span>Estimate</span><span id="estt"></span></div>
            <small class="muted"
              >Preliminary — final price is computed after our employee verifies
              the measurements on site.</small
            >
          </div>
          <div class="actions">
            <button class="btn" id="go" type="button">
              Satisfied — request quotation</button
            ><button class="btn ghost" id="save" type="button">
              Save design
            </button>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/customizer.js"></script>
  </body>
</html>
