<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register · Southworks (Trinity)</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="auth">
    <form class="card auth-card" id="f" novalidate>
      <div class="brand">
        <span class="logo">S</span>
        <div><b>SOUTHWORKS</b><small>Customer registration</small></div>
      </div>
      <h2>Create account</h2>
      <p class="muted">Register to customize products and track projects.</p>
      <label
        >Full name<input
          id="name"
          placeholder="Juan Dela Cruz"
          autocomplete="name"
          required
      /></label>
      <label
        >Email<input
          type="email"
          id="email"
          placeholder="you@email.com"
          autocomplete="email"
          required
      /></label>
      <label
        >Contact number<input
          id="phone"
          inputmode="tel"
          placeholder="09xx xxx xxxx"
          autocomplete="tel"
          required
      /></label>
      <label
        >Password<input
          type="password"
          id="pw"
          placeholder="At least 6 characters"
          autocomplete="new-password"
          required
      /></label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit">Save account</button>
      <p class="muted c">Already registered? <a href="index.html">Log in</a></p>
    </form>
    <script src="js/app.js"></script>
    <script>
      (function () {
        const $ = SW.$;
        $("f").onsubmit = (e) => {
          e.preventDefault();
          const name = $("name").value.trim(),
            email = $("email").value.trim(),
            phone = $("phone").value.trim(),
            pw = $("pw").value;
          let m = "";
          if (name.length < 2) m = "Please enter your full name.";
          else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))
            m = "Please enter a valid email address.";
          else if (!/^[0-9+()\-\s]{7,}$/.test(phone))
            m = "Please enter a valid contact number.";
          else if (pw.length < 6) m = "Password must be at least 6 characters.";
          if (m) {
            $("err").textContent = m;
            return;
          }
          try {
            const u = SW.addUser({
              name,
              email,
              phone,
              password: pw,
              role: "customer",
            });
            SW.setSession(u.id);
            location.href = "customize.html";
          } catch (x) {
            $("err").textContent = x.message;
          }
        };
      })();
    </script>
  </body>
</html>
